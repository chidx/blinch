version: '3.8'

services:
  # Blinch Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blinch-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NETWORK=chipnet
      - ELECTRUM_SERVER=chipnet.imaginary.cash
      - ELECTRUM_PORT=50004
      - PAYMENT_RECIPIENT=bitcoincash:qzp2wq8l9r5h6l7x8z9c0b1n2m3k4j5k6l7z8c9b0n1
      - API_ACCESS_AMOUNT=1000
      - PREMIUM_AMOUNT=5000
    restart: unless-stopped
    networks:
      - blinch-network

networks:
  blinch-network:
    driver: bridge
